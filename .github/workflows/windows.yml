# Murmur for Windows: C# tests on Linux and Windows, and the ported-file hash check.
# Golden regeneration (windows/golden/generate.sh --check) runs only on the dev Mac through
# app/check.sh windows_parity: hosted macOS runners are older than the Mac the golden files come from.
# app/** is included because a Mac change to a ported file or shared corpus must fail here until it is
# ported (windows/CONTRIBUTING.md, "Porting a Mac change").
name: Windows port
on:
  push:
    paths: ["windows/**", "app/**", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["windows/**", "app/**", ".github/workflows/windows.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sherpa-directml:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build pinned sherpa-onnx DirectML runtime
        run: windows/tools/build-sherpa-directml.ps1 -WorkDir "$env:RUNNER_TEMP/sherpa" -Out "$env:RUNNER_TEMP/sherpa-native"
      - name: Upload native runtime for verification
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sherpa-directml-win-x64
          path: ${{ runner.temp }}/sherpa-native
          retention-days: 14
          if-no-files-found: error
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"
      - name: Ported Swift files unchanged since their port
        run: python3 windows/tools/check_parity.py
        if: runner.os == 'Linux'
      - name: C# tests against the shared corpora and golden files
        run: dotnet test windows/Murmur.Windows.slnx
        if: runner.os == 'Linux'
      - name: Windows app build and all tests (core, platform)
        run: dotnet test windows/Murmur.App.slnx
        if: runner.os == 'Windows'
      - name: Publish the unsigned app for manual testing
        if: runner.os == 'Windows'
        run: dotnet publish windows/src/Murmur.App -c Release -r win-x64 -o out/Murmur
      - name: Upload the unsigned build
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Murmur-windows-x64-unsigned
          path: out/Murmur
          retention-days: 14
          if-no-files-found: error
