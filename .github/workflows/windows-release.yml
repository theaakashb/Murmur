# DRAFT. Runs on a pushed windows-vX.Y.Z tag or by hand. Follows windows/PLAN.md "Release flow" steps 1-4.
# Signing is a placeholder until M6. A tag run uploads to a DRAFT release only; publishing stays manual and a
# Windows release is never marked latest (the Mac appcast follows latest). The Mac flow owns appcast.xml and the Mac ZIP.
name: windows-release
on:
  push:
    tags: ['windows-v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version X.Y.Z or X.Y.Z-pre.N, e.g. 0.1.0-beta.1 (the tag becomes windows-v<version>)
        required: true
      sign:
        description: Sign with Azure Artifact Signing (needs the secrets below)
        type: boolean
        default: false
      upload:
        description: Upload to a DRAFT GitHub release (publishing and "latest" stay manual)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write   # draft release upload only
    env:
      # A tag run takes the version from the tag (windows-v1.2.3 -> 1.2.3); a manual run from its input.
      VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
      UPLOAD: ${{ github.ref_type == 'tag' || inputs.upload }}
    steps:
      - name: Check version
        shell: pwsh
        run: |
          $v = $env:VERSION -replace '^windows-v', ''
          # SemVer 2 core plus an optional pre-release (no build metadata); Velopack and the .NET SDK both accept it.
          if ($v -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$') { Write-Error "Bad version '$env:VERSION' (want windows-vX.Y.Z or windows-vX.Y.Z-beta.N)"; exit 1 }
          "VERSION=$v" >> $env:GITHUB_ENV
          # A pre-release version uploads as a GitHub pre-release (still a draft).
          "PRE=$(if ($v.Contains('-')) { '--pre' } else { '' })" >> $env:GITHUB_ENV
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # 1. Build and test.
      - run: dotnet build windows/Murmur.App.slnx -c Release
      - run: dotnet test windows/Murmur.App.slnx -c Release --no-build
      # 2. Previous Windows release, so vpk can build a delta. Continue on first release.
      - name: Download previous release
        shell: pwsh
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          dotnet tool install vpk --version 1.2.161 --tool-path windows/tools/.vpk
          windows/tools/.vpk/vpk.exe download github --repoUrl "https://github.com/${{ github.repository }}" --channel win --outputDir releases --token $env:GH_TOKEN
        continue-on-error: true
      # 3. Pack (self-contained x64 publish + vpk pack). Signing flags: edit windows/tools/package.ps1 when enabling.
      - name: Pack
        shell: pwsh
        run: windows/tools/package.ps1 -Version "$env:VERSION" -Out releases
      - name: Sign (M6 placeholder; manual runs only)
        if: ${{ github.ref_type != 'tag' && inputs.sign }}
        shell: pwsh
        run: Write-Error 'Signing is not wired yet: add --azureTrustedSignFile / --signParams in package.ps1 and the Azure login step first.'; exit 1
      # 4. Draft upload only.
      - name: Upload to draft release
        if: ${{ env.UPLOAD == 'true' }}
        shell: pwsh
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          $pre = @(); if ($env:PRE) { $pre = @($env:PRE) }
          windows/tools/.vpk/vpk.exe upload github --repoUrl "https://github.com/${{ github.repository }}" --channel win --outputDir releases --tag "windows-v$env:VERSION" --merge @pre --token $env:GH_TOKEN
      - uses: actions/upload-artifact@v4
        with: { name: "windows-release-${{ env.VERSION }}", path: releases/*.nupkg }
